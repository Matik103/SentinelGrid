  <path d="m420 777 31-19 33 14 22 35-15 39-21 18-5 50-21 40-20-27 4-43-21-32 6-39z"/>
  <path d="m545 653 32-20 45 9 31 25 39 2 31 28-16 26-42 5-20 30-29-9-16-30-31-8-13-26-34-3z"/>
