<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
<title id="title">SentinelGrid shield</title><desc id="desc">A luminous cyan shield containing an industrial skyline, an ECG pulse and a globe, with an orbiting ring. Transparent background.</desc>
<defs>
 <linearGradient id="rim" x1="150" y1="80" x2="850" y2="940" gradientUnits="userSpaceOnUse"><stop stop-color="#9CFFF4"/><stop offset=".22" stop-color="#19F5E3"/><stop offset=".62" stop-color="#00BFEA"/><stop offset="1" stop-color="#0877D5"/></linearGradient>
 <linearGradient id="inner" x1="220" y1="180" x2="780" y2="900" gradientUnits="userSpaceOnUse"><stop stop-color="#073D59"/><stop offset=".55" stop-color="#031D32"/><stop offset="1" stop-color="#04172D"/></linearGradient>
 <linearGradient id="city" x1="300" y1="240" x2="720" y2="590" gradientUnits="userSpaceOnUse"><stop stop-color="#22F8E4"/><stop offset=".55" stop-color="#079CCB"/><stop offset="1" stop-color="#075B9B"/></linearGradient>
 <radialGradient id="ocean" cx="50%" cy="28%" r="75%"><stop stop-color="#16DDF0"/><stop offset=".5" stop-color="#087DAF"/><stop offset="1" stop-color="#031F3D"/></radialGradient>
 <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="13" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
 <clipPath id="shieldClip"><path d="M512 92 830 225v260c0 207-126 347-318 449C320 832 194 692 194 485V225L512 92Z"/></clipPath>
 <clipPath id="globeClip"><path d="M260 738C320 646 414 605 514 605s194 41 254 133c-25 145-125 250-256 315-130-65-230-170-252-315Z"/></clipPath>
</defs>
<!-- orbit behind shield -->
<path d="M110 640C205 748 393 785 600 718c129-42 236-123 310-232" fill="none" stroke="#00CDEB" stroke-width="30" stroke-linecap="round" opacity=".18" filter="url(#soft)"/>
<path d="M110 640C205 748 393 785 600 718c129-42 236-123 310-232" fill="none" stroke="url(#rim)" stroke-width="15" stroke-linecap="round" filter="url(#glow)"/>
<path d="M110 640C205 748 393 785 600 718c129-42 236-123 310-232" fill="none" stroke="#B8FFF8" stroke-width="4" stroke-linecap="round"/>
<!-- shield -->
<path d="M512 92 830 225v260c0 207-126 347-318 449C320 832 194 692 194 485V225L512 92Z" fill="url(#inner)" stroke="url(#rim)" stroke-width="24" stroke-linejoin="round" filter="url(#glow)"/>
<path d="M512 126 796 246v239c0 185-112 312-284 407-172-95-284-222-284-407V246l284-120Z" fill="none" stroke="#65F8F1" stroke-opacity=".62" stroke-width="7"/>
<g clip-path="url(#shieldClip)">
