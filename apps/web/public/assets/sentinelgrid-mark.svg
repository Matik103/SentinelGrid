  <path d="M345 360h16v18h-16zm28 0h16v18h-16zm-28 35h16v18h-16zm28 0h16v18h-16zM645 372h15v18h-15zm28 0h15v18h-15zm-28 35h15v18h-15zm28 0h15v18h-15z"/>
