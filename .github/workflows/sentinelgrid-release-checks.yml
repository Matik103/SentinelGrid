name: SentinelGrid release checks

on:
  push:
    branches:
      - work/sentinel-command-release-v2
  pull_request:
    branches:
      - work/sentinel-command-release-v2

permissions:
  contents: read

concurrency:
  group: sentinelgrid-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build shared package
        run: npm run build -w @sentinelgrid/shared
      - name: Build API
        run: npm run build -w @sentinelgrid/api
      - name: Test API
        run: npm test -w @sentinelgrid/api
      - name: Build web
        run: npm run build -w @sentinelgrid/web
