name: Prepare transparent SentinelGrid logo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/process-logo.py"
      - ".github/workflows/prepare-logo.yml"

permissions:
  contents: write

jobs:
  remove-logo-background:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install opencv-python-headless
      - run: python scripts/process-logo.py
      - name: Commit transparent logo asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/public/assets/sentinelgrid-logo.png
          git commit -m "Add transparent SentinelGrid logo asset [skip ci]"
          git push origin main
