services:
  - type: web
    name: sentinelgrid-api
    runtime: docker
    plan: starter
    # Deploy Nest from the shared working branch (Vercel FE production stays on main).
    branch: work/sentinel-command-release-v2
    autoDeploy: true
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
      - key: CORS_ORIGINS
        value: https://www.sentinelgrid.tech,https://sentinelgrid.tech,https://sentinelgrid-delta.vercel.app,https://sentinelgrid-git-work-sentinel-command-re-e5a6dd-excel-11ea67ae.vercel.app
      - key: SG_PUBLIC_APP_URL
        value: https://www.sentinelgrid.tech
      - key: SG_EMAIL_TRANSPORT
        value: resend
      - key: SG_EMAIL_WORKER_ENABLED
        value: "true"
      # Starter single-instance memory rate limits (code also allows memory unless RATE_LIMIT_ALLOW_MEMORY=0).
      # Prefer REDIS_URL for multi-instance. If Blueprint env did not sync, set these in the Dashboard.
      - key: RATE_LIMIT_ALLOW_MEMORY
        value: "1"
      # Required secrets — set in the Render Dashboard (sync:false). Never commit values.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SG_EMAIL_FROM
        sync: false
      # Evidence payloads → Supabase Storage (S3 protocol), NOT Amazon S3.
      # Project abaeizgfsskvjklfslrh, private bucket evidence-payloads.
      # Production never selects local_dev (even if Dashboard still has it — Nest ignores it).
      # Blueprint sync often skips existing services — set secrets in Dashboard if needed.
      - key: PAYLOAD_STORAGE_BACKEND
        value: s3_compatible
      - key: S3_BUCKET
        value: evidence-payloads
      - key: S3_ENDPOINT
        value: https://abaeizgfsskvjklfslrh.storage.supabase.co/storage/v1/s3
      - key: S3_FORCE_PATH_STYLE
        value: "true"
      # From Supabase Dashboard → Storage → S3 connection / access keys (server-only).
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      # Optional: REDIS_URL for multi-instance rate limiting (then RATE_LIMIT_ALLOW_MEMORY can go)
      - key: REDIS_URL
        sync: false
      # Optional: set in Render to the deployed git SHA for /v1/health monitoring.build_sha
      - key: GIT_SHA
        sync: false
